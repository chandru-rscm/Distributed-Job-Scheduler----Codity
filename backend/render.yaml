services:
  - type: web
    name: peak-api
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peak-db
          property: connectionString

  - type: worker
    name: peak-worker
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.worker --shard shard-0"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peak-db
          property: connectionString

databases:
  - name: peak-db
    region: ohio
    plan: free
